<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Dunyatek Chatbot Widget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: transparent;
      }
      .widget-shell {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .chat-frame {
        width: 360px;
        max-width: 100%;
        height: 560px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.35);
      }
      .chat-header {
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #ffffff;
        min-height: 56px;
        transition: all 0.2s ease;
      }
      .chat-avatar {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.3);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: all 0.2s ease;
      }
      .chat-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .chat-title {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-body {
        flex: 1;
        padding: 10px;
        display: flex;
        flex-direction: column;
        background: #e2e8f0;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 4px;
      }
      .bubble-row {
        display: flex;
        margin-bottom: 4px;
      }
      .bubble-row.user {
        justify-content: flex-end;
      }
      .bubble-row.bot {
        justify-content: flex-start;
      }
      .bubble {
        max-width: 80%;
        padding: 6px 10px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.4;
      }
      .bubble.user {
        color: #ffffff;
      }
      .bubble.bot {
        background: #ffffff;
        color: #0f172a;
      }
      .chat-input {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .chat-input input {
        flex: 1;
        padding: 8px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        font-size: 13px;
        outline: none;
      }
      .chat-input button {
        padding: 8px 12px;
        border-radius: 999px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="widget-shell">
      <div class="chat-frame" id="chat-frame" aria-label="Dunyatek Chatbot">
        <div class="chat-header" id="chat-header">
          <div class="chat-avatar" id="chat-avatar">🤖</div>
          <div class="chat-title" id="chat-title">Chatbot</div>
        </div>
        <div class="chat-body">
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-input" id="chat-form">
            <input
              type="text"
              id="chat-input"
              placeholder="Mesajınızı yazın..."
              autocomplete="off"
            />
            <button type="submit" id="chat-send">Gönder</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var API_BASE = 'https://dunyatekchatbot.onrender.com';

        function getQueryParam(name) {
          var params = new URLSearchParams(window.location.search);
          return params.get(name) || '';
        }

        var botId = getQueryParam('botId') || '1';

        var header = document.getElementById('chat-header');
        var avatarEl = document.getElementById('chat-avatar');
        var titleEl = document.getElementById('chat-title');
        var messagesEl = document.getElementById('chat-messages');
        var formEl = document.getElementById('chat-form');
        var inputEl = document.getElementById('chat-input');
        var sendBtn = document.getElementById('chat-send');

        function appendMessage(text, from) {
          var row = document.createElement('div');
          row.className = 'bubble-row ' + (from === 'user' ? 'user' : 'bot');

          var bubble = document.createElement('div');
          bubble.className = 'bubble ' + (from === 'user' ? 'user' : 'bot');
          bubble.textContent = text;

          row.appendChild(bubble);
          messagesEl.appendChild(row);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // Başlangıç mesajı
        appendMessage('Merhaba, size nasıl yardımcı olabilirim?', 'bot');

        // Appearance bilgisini çek
        fetch(API_BASE + '/api/bots/' + encodeURIComponent(botId) + '/appearance')
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            if (!data || !data.ok || !data.appearance) return;
            var ap = data.appearance;

            var headerHeight = ap.headerHeight || 56;
            var avatarSize = ap.avatarSize || Math.max(Math.round(headerHeight * 0.6), 28);
            var avatarBg = ap.avatarBackground || 'rgba(255,255,255,0.3)';
            var verticalPadding = Math.max(8, (headerHeight - avatarSize) / 2);

            var themeColor = ap.themeColor || '#2563eb';
            header.style.background = themeColor;
            header.style.padding = verticalPadding + 'px 14px';
            header.style.minHeight = headerHeight + 'px';
            sendBtn.style.background = themeColor;

            if (ap.title) {
              titleEl.textContent = ap.title;
            }

            if (ap.botAvatarUrl) {
              avatarEl.innerHTML = '';
              var img = document.createElement('img');
              img.src = ap.botAvatarUrl;
              img.alt = 'Chatbot Avatar';
              avatarEl.appendChild(img);
            } else {
              avatarEl.textContent = '🤖';
            }

            avatarEl.style.width = avatarSize + 'px';
            avatarEl.style.height = avatarSize + 'px';
            avatarEl.style.fontSize = Math.max(16, Math.round(avatarSize * 0.55)) + 'px';

            if (avatarBg === 'transparent') {
              avatarEl.style.background = 'transparent';
              avatarEl.style.border = '1px solid rgba(255,255,255,0.5)';
            } else {
              avatarEl.style.background = avatarBg;
              avatarEl.style.border = 'none';
            }
          })
          .catch(function (err) {
            console.error('Appearance alınamadı', err);
          });

        async function sendMessage(text) {
          appendMessage(text, 'user');
          inputEl.value = '';

          var payload = {
            message: text,
            botId: botId,
          };

          function safeJson(res) {
            return res
              .json()
              .catch(function () {
                return null;
              });
          }

          try {
            var reply = '';

            // Önce QA/Metin/Link/PDF tabanlı cevabı dene
            var kbResponse = await fetch(API_BASE + '/api/chat', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            });
            if (kbResponse.ok) {
              var kbData = await safeJson(kbResponse);
              if (kbData && kbData.ok && kbData.reply) {
                reply = kbData.reply;
              }
            }

            // Gerekirse LLM'e düş
            if (!reply) {
              var llmResponse = await fetch(API_BASE + '/api/chat-llm', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
              });
              if (llmResponse.ok) {
                var llmData = await safeJson(llmResponse);
                if (llmData && llmData.ok && llmData.reply) {
                  reply = llmData.reply;
                }
              }
            }

            appendMessage(reply || 'Şu anda yanıt veremiyorum.', 'bot');
          } catch (err) {
            console.error('Chat hatası', err);
            appendMessage('Sunucuya bağlanırken hata oluştu.', 'bot');
          }
        }

        formEl.addEventListener('submit', function (e) {
          e.preventDefault();
          var text = (inputEl.value || '').trim();
          if (!text) return;
          sendMessage(text);
        });
      })();
    </script>
  </body>
</html>
